name: Deploy static site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 方案 X：把 Three.js 一起发布，站点离线可用；若选方案 Y 删除这一步和下方 cp
      - name: Vendor Three.js
        run: npm run vendor

      - name: Assemble site
        run: |
          rm -rf _site
          mkdir -p _site
          git archive HEAD | tar -x -C _site
          mkdir -p _site/vendor
          cp vendor/three.module.js _site/vendor/three.module.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
